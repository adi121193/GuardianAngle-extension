<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PII Guardian - ML Inference Test</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 {
      color: #2563eb;
      margin-top: 0;
    }
    .test-area {
      margin: 20px 0;
    }
    textarea {
      width: 100%;
      min-height: 120px;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      resize: vertical;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      margin-right: 10px;
      margin-top: 10px;
    }
    button:hover {
      background: #1d4ed8;
    }
    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }
    .status {
      margin: 20px 0;
      padding: 12px;
      background: #f3f4f6;
      border-radius: 6px;
      font-size: 13px;
    }
    .status.success {
      background: #d1fae5;
      color: #065f46;
    }
    .status.error {
      background: #fee2e2;
      color: #991b1b;
    }
    .results {
      margin: 20px 0;
    }
    .entity {
      display: inline-block;
      margin: 4px;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 500;
    }
    .entity-PER {
      background: #dbeafe;
      color: #1e40af;
    }
    .entity-ORG {
      background: #fef3c7;
      color: #92400e;
    }
    .entity-LOC {
      background: #d1fae5;
      color: #065f46;
    }
    .performance {
      margin-top: 20px;
      padding: 12px;
      background: #f3f4f6;
      border-radius: 6px;
      font-size: 13px;
      font-family: monospace;
    }
    .loading {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #e5e7eb;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-left: 8px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🛡️ PII Guardian - ML Inference Test</h1>

    <div class="test-area">
      <h3>Test Input</h3>
      <textarea id="testInput" placeholder="Enter text to detect PII entities...">My name is John Smith and I work at Google in New York City. You can reach me at john@example.com.</textarea>
    </div>

    <div>
      <button id="initBtn">Initialize Model</button>
      <button id="runBtn" disabled>Run Inference</button>
      <button id="statusBtn">Check Status</button>
    </div>

    <div id="status" class="status" style="display: none;"></div>

    <div id="results" class="results" style="display: none;">
      <h3>Detected Entities</h3>
      <div id="entities"></div>
    </div>

    <div id="performance" class="performance" style="display: none;"></div>
  </div>

  <script type="module" src="../ml-test/test.js"></script>
</body>
</html>
