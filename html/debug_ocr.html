<!DOCTYPE html>
<html>

<head>
    <title>PII Guardian - Blackbox OCR Dashboard</title>
    <link rel="stylesheet" href="../styles/popup.css">
    <style>
        body {
            padding: 20px;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .status-card {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ccc;
            margin-right: 8px;
        }

        .status-ok {
            background: #4caf50;
        }

        .status-error {
            background: #f44336;
        }

        .status-warn {
            background: #ff9800;
        }

        .log-console {
            background: #1a1a1a;
            color: #0f0;
            padding: 15px;
            border-radius: 4px;
            height: 400px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
        }

        .btn-test {
            background: #2196f3;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-test:hover {
            background: #1976d2;
        }
    </style>
</head>

<body>
    <h1>🕵️ Blackbox OCR Dashboard</h1>
    <p>Live debugging of the Service Worker -> Offscreen -> Tesseract pipeline.</p>

    <div class="dashboard-grid">
        <!-- Controls -->
        <div class="status-card">
            <h3>System Controls</h3>
            <div style="margin-bottom: 15px;">
                <label>Upload Test Image:</label><br>
                <input type="file" id="imageInput" accept="image/*" style="margin-top: 5px;">
            </div>

            <div id="pipelineStatus">
                <div><span class="status-indicator" id="status-sw"></span> Service Worker</div>
                <div><span class="status-indicator" id="status-offscreen"></span> Offscreen Document</div>
                <div><span class="status-indicator" id="status-ocr"></span> Tesseract Core</div>
            </div>
        </div>

        <!-- Logs -->
        <div class="log-console" id="logs">
            [WAITING FOR LOGS]...
        </div>
    </div>

    <script type="module" src="../ui/debugOcr.js"></script>
</body>

</html>
